# Java di sistema = 8, non accettato da AGP: si punta al JDK 21 locale (stessa
# macchina di DomusHub). Se il progetto cambia postazione, aggiornare o
# rimuovere questa riga esportando JAVA_HOME prima di ./gradlew.
org.gradle.java.home=/Users/luca/Library/Java/JavaVirtualMachines/openjdk-21.0.1/Contents/Home

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# iOS predisposto ma spento: accenderlo scarica la toolchain Kotlin/Native (~1 GB).
# Si attiva con -PenableIos=true.
enableIos=true
kotlin.apple.xcodeCompatibility.nowarn=true
